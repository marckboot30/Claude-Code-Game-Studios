<script>

  'Polegar esquerdo: andar   ·   Arraste à direita: olhar',

  'Botões: correr, lanterna, fabricar, câmera e pausa',

const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';

let seed;

  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// The town's layout has its own seeded generator, so a restart keeps the same town

let wseed = (CONFIG.seed * 7919) | 0;
function wrng() {
  wseed = (wseed + 0x6D2B79F5) | 0;

const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wcanvas = document.getElementById('world');
const renderer = new THREE.WebGLRenderer({ canvas: wcanvas, antialias: !CHEAP && !LIGHT, powerPreference: 'high-performance' });

function fit() {

addEventListener('resize', fit); fit();

// ---- Input ---------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {

});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
let lookX = 0, lookY = 0; // mouse movement since the last step
addEventListener('mousemove', e => {
  if (document.pointerLockElement === canvas) { lookX += e.movementX; lookY += e.movementY; }
});
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || TOUCH) return; // touch has its own handler
  startAudio();
  if (scene === 'title') { reset(); scene = 'play'; }
  else if (scene === 'pause') scene = 'play';
  else if (scene === 'over') { runs++; reset(); scene = 'play'; }
  if (scene === 'play' && canvas.requestPointerLock) { try { canvas.requestPointerLock(); } catch (e) { /* not allowed here */ } }
});
document.addEventListener('pointerlockchange', () => {
  if (!TOUCH && !document.pointerLockElement && scene === 'play') scene = 'pause';

// ---- Touch controls ----------------------------------------------------------------------
// Left side: a joystick that appears where the thumb lands. Right side: drag to look.
// Buttons: search (hold), run (toggle), flashlight, pause. A tap on a backpack slot uses it.
const touch = { joy: null, look: null, run: false, btn: new Map(), joyX: 0, joyY: 0 };
const BTN = {};
function layoutButtons() { // the right thumb's column, kept clear of the backpack
  BTN.search = { x: W - 118, y: H - 140, r: 62, label: 'VASCULHAR' };
  BTN.run = { x: W - 255, y: H - 215, r: 44, label: 'CORRER' };
  BTN.flash = { x: W - 80, y: H - 295, r: 40, label: 'LANTERNA' };
  BTN.pause = { x: W - 44, y: 44, r: 28, label: '' };
  BTN.view = { x: W - 112, y: 44, r: 28, label: '' };
  BTN.craft = { x: W - 215, y: H - 330, r: 40, label: 'FABRICAR' };
}
layoutButtons();
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function slotAt(p) {
  const n = capacity(), sz = 66, gap = 8, x0 = W / 2 - (n * (sz + gap) - gap) / 2, y0 = H - sz - 16;
  if (p.y < y0 || p.y > y0 + sz) return -1;

  return i >= 0 && i < n && (p.x - x0) - i * (sz + gap) <= sz ? i : -1;
}
function goFullscreen() {
  try {
    const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f && !document.fullscreenElement) Promise.resolve(f.call(el)).then(() => {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    }).catch(() => {});
  } catch (e) { /* fullscreen not allowed here */ }
}
const portrait = () => TOUCH && innerHeight > innerWidth;
addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' && !TOUCH) return;
  e.preventDefault(); startAudio();
  if (portrait()) return;
  if (scene === 'title') { goFullscreen(); reset(); scene = 'play'; return; }
  if (scene === 'pause') { scene = 'play'; return; }
  if (scene === 'over') { runs++; reset(); scene = 'play'; return; }
  if (scene !== 'play') return;
  const p = toLogical(e);
  for (const k in BTN) {
    const b = BTN[k];
    if (Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 12) {
      touch.btn.set(e.pointerId, k);
      if (k === 'search') down.add('KeyE'), hit.add('KeyE');
      else if (k === 'run') touch.run = !touch.run;
      else if (k === 'flash') hit.add('KeyF');
      else if (k === 'pause') hit.add('KeyP');
      else if (k === 'view') hit.add('KeyV');
      else if (k === 'craft') hit.add('KeyC');
      return;
    }
  }
  if (state.craftOpen) { const ri = craftRowAt(p); if (ri >= 0) hit.add('Digit' + (ri + 1)); else if (ri === -2) state.craftOpen = false; return; }
  const si = slotAt(p);
  if (si >= 0) { hit.add('Digit' + (si + 1)); return; }
  if (p.x < W * 0.45 && !touch.joy) touch.joy = { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y };

}, { passive: false });
function touchEnd(e) {
  if (touch.joy && touch.joy.id === e.pointerId) { touch.joy = null; touch.joyX = touch.joyY = 0; }
  if (touch.look && touch.look.id === e.pointerId) touch.look = null;

addEventListener('contextmenu', e => { if (TOUCH) e.preventDefault(); });
function drawTouch() {

    ctx.fillStyle = on ? 'rgba(225,212,180,0.55)' : ready ? 'rgba(200,180,120,0.45)' : 'rgba(20,20,18,0.4)';

      if (state.flash) { ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.moveTo(b.x + 8, b.y - 16); ctx.lineTo(b.x + 22, b.y - 22); ctx.lineTo(b.x + 22, b.y + 5); ctx.lineTo(b.x + 8, b.y - 1); ctx.fill(); ctx.globalAlpha = 1; }
    } else if (k === 'pause') { ctx.fillRect(b.x - 9, b.y - 11, 6, 22); ctx.fillRect(b.x + 3, b.y - 11, 6, 22); }

      ctx.fillStyle = '#222'; ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(viewMode === 3 ? '3ª' : '1ª', b.x - 2, b.y + 1);
    }

function drawPortrait() {

// ---- Audio ---------------------------------------------------------------------------
let audio = null, muted = false;

    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination);

    for (let i = 0; i < len; i++) d[i] = vr(i * 0.37) * 2 - 1;

function tone(freq, dur, type = 'sine', vol = 0.2, slide = 0) {

const sfx = {

// ---- Items ---------------------------------------------------------------------------

// ---- The world (three.js) --------------------------------------------------------------
const world = new THREE.Scene();

function drawCompass() {

  ctx.fillStyle = g; ctx.fillRect(cx - cw / 2, y - 16, cw, 30);

  for (let i = 0; i < 24; i++) {
    const b = i / 24 * Math.PI * 2, rel = wrap(b - heading); if (Math.abs(rel) > half) continue;
    const x = cx + rel / half * cw / 2;
    if (i % 3 === 0) text(L[i / 3], x, y - 1, i === 0 ? 17 : 14, i === 0 ? '#ffcf8a' : '#e6e0d2', 'center', '700');
    else { ctx.fillStyle = 'rgba(230,224,210,0.5)'; ctx.fillRect(x - 0.75, y - 6, 1.5, 9); }
  }
  for (const p of PLACES) {

    if (dist < p.r * 0.5) continue;

  }
  ctx.restore();
  ctx.fillStyle = '#ffcf8a'; ctx.fillRect(cx - 1, y - 17, 2, 7);

  ctx.fillStyle = 'rgba(14,13,12,0.86)'; ctx.fillRect(L.px, L.py, L.pw, L.ph);
  ctx.strokeStyle = 'rgba(220,210,190,0.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(L.px + 0.5, L.py + 0.5, L.pw - 1, L.ph - 1);
  shadowText('Fabricação', L.px + 22, L.py + 28, 22, '#efe7d6', 'left', '600');
  shadowText(TOUCH ? 'Toque numa receita · toque fora para fechar' : '1 a 5: fabricar  ·  C: fechar', L.px + L.pw - 20, L.py + 28, 14, '#a9a192', 'right');
  RECIPES.forEach((r, i) => {
    const y = L.py + 56 + i * L.rh, m = missing(r), ok = !m.length;
    ctx.fillStyle = ok ? 'rgba(200,170,110,0.16)' : 'rgba(255,255,255,0.03)'; ctx.fillRect(L.px + 10, y + 3, L.pw - 20, L.rh - 6);
    ctx.globalAlpha = ok ? 1 : 0.55;
    text(String(i + 1), L.px + 28, y + L.rh / 2, 14, '#9c9688');
    recipeIcon(r.id, L.px + 62, y + L.rh / 2, 34);
    text(r.name, L.px + 92, y + L.rh / 2 - 9, 17, ok ? '#f3ead8' : '#cfc7b6', 'left', '600');
    const need = Object.keys(r.needs).map(id => `${count(id)}/${r.needs[id]} ${ITEMS[id].name.toLowerCase()}`).join('  ·  ') + (r.fire ? '  ·  fogueira' : '');
    text(need, L.px + 92, y + L.rh / 2 + 11, 13, '#b5ad9c', 'left');
    const what = typeof r.what === 'function' ? r.what() : r.what;
    text(ok ? what : 'falta: ' + m.join(', '), L.px + L.pw - 22, y + L.rh / 2, 13, ok ? '#d8c79e' : '#d79a8a', 'right');
    ctx.globalAlpha = 1;
  });
  text('Pano, fita e fósforos: armários, cômodas e caixas  ·  Lenha: árvores fora da cidade', W / 2, L.py + L.ph - 18, 13, '#8f887b');
}
function recipeIcon(id, x, y, s) {
  if (id === 'fogueira') {
    const u = s / 40; ctx.save(); ctx.translate(x, y); ctx.scale(u, u);
    ctx.fillStyle = '#5a3f2a'; ctx.save(); ctx.rotate(0.35); ctx.fillRect(-16, 8, 32, 6); ctx.restore(); ctx.save(); ctx.rotate(-0.35); ctx.fillRect(-16, 8, 32, 6); ctx.restore();
    ctx.fillStyle = '#e07a2e'; ctx.beginPath(); ctx.moveTo(0, -18); ctx.quadraticCurveTo(14, -2, 8, 10); ctx.lineTo(-8, 10); ctx.quadraticCurveTo(-14, -2, 0, -18); ctx.fill();
    ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.moveTo(0, -6); ctx.quadraticCurveTo(7, 3, 4, 10); ctx.lineTo(-4, 10); ctx.quadraticCurveTo(-7, 3, 0, -6); ctx.fill();
    ctx.restore();
  } else if (id === 'mochila') {
    const u = s / 40; ctx.save(); ctx.translate(x, y); ctx.scale(u, u);
    ctx.fillStyle = '#6b5638'; rr(-13, -14, 26, 30, 6); ctx.fill(); ctx.fillStyle = '#56442c'; ctx.fillRect(-10, 2, 20, 10);
    ctx.strokeStyle = '#3b3023'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -14, 7, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#c9c3b5'; ctx.fillRect(9, -18, 10, 3); ctx.fillRect(12.5, -21.5, 3, 10);
    ctx.restore();
  } else icon(id, x, y, s);
}

// ---- Loop --------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { if (portrait()) drawPortrait(); else scenes[scene].draw(ALPHA); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  houses, containers, trees, fires, RECIPES,
  get size() { return [W, H]; },
  PLACES, lakes,
  get buttons() { return BTN; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
