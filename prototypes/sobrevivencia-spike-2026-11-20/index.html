<script>
'use strict';

const STEP = 1 / 60;
let W = 1280, H = 720; // a computer keeps 16:9; a phone fills its screen at a 480-high logical size (fit)
const PIXEL = false;
const FONT = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';
const TITLE = 'SOBREVIVÊNCIA';
const CONTROLS = TOUCH ? [
  'Polegar esquerdo: andar   ·   Arraste à direita: olhar',
  'Segure VASCULHAR perto de um móvel   ·   Toque na mochila: comer / beber',
  'Botões: correr, lanterna e pausa',

  'W A S D: andar   ·   Mouse: olhar (ou setas ← →)   ·   Shift: correr',
  'Segure E: vasculhar móveis   ·   1 a 6: comer / beber / usar',

const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };

let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random

// The town's layout has its own seeded generator, so a restart keeps the same town

let wseed = (CONFIG.seed * 7919) | 0;
function wrng() {

const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wcanvas = document.getElementById('world');
const renderer = new THREE.WebGLRenderer({ canvas: wcanvas, antialias: !CHEAP && !LIGHT, powerPreference: 'high-performance' });

addEventListener('resize', fit); fit();

// ---- Input ---------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();

addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
let lookX = 0, lookY = 0; // mouse movement since the last step
addEventListener('mousemove', e => {
  if (document.pointerLockElement === canvas) { lookX += e.movementX; lookY += e.movementY; }
});
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || TOUCH) return; // touch has its own handler
  startAudio();
  if (scene === 'title') { reset(); scene = 'play'; }
  else if (scene === 'pause') scene = 'play';
  else if (scene === 'over') { runs++; reset(); scene = 'play'; }
  if (scene === 'play' && canvas.requestPointerLock) { try { canvas.requestPointerLock(); } catch (e) { /* not allowed here */ } }

  if (!TOUCH && !document.pointerLockElement && scene === 'play') scene = 'pause';

// ---- Touch controls ----------------------------------------------------------------------
// Left side: a joystick that appears where the thumb lands. Right side: drag to look.
// Buttons: search (hold), run (toggle), flashlight, pause. A tap on a backpack slot uses it.
const touch = { joy: null, look: null, run: false, btn: new Map(), joyX: 0, joyY: 0 };
const BTN = {};
function layoutButtons() { // the right thumb's column, kept clear of the backpack
  BTN.search = { x: W - 118, y: H - 140, r: 62, label: 'VASCULHAR' };
  BTN.run = { x: W - 255, y: H - 215, r: 44, label: 'CORRER' };
  BTN.flash = { x: W - 80, y: H - 295, r: 40, label: 'LANTERNA' };

layoutButtons();

// ---- Items ---------------------------------------------------------------------------

const CNAME = { geladeira: 'geladeira', armario: 'armário', caixa: 'caixa', comoda: 'cômoda', prateleira: 'prateleira' };

// ---- The world (three.js) --------------------------------------------------------------

function rollLoot(type, chance = 1) {
  const t = CONFIG.loot[type], out = [];

  const max = Math.round(t.max * tune.loot_mult);
  const n = t.min + Math.floor(rng() * (Math.max(t.min, max) - t.min + 1));

  if (s.thirst <= 0) st.push('Desidratado'); else if (s.thirst < 20) st.push('Com sede');
  if (s.sick > 0) st.push('Doente');
  if (st.length) shadowText(st.join('  ·  '), 28, TOUCH ? by + 126 : H - 142, 16, '#ffb0a0', 'left', '600');
  // backpack
  const n = tune.slots, sz = TOUCH ? 66 : 58, gap = 8, x0 = W / 2 - (n * (sz + gap) - gap) / 2, y0 = H - sz - (TOUCH ? 16 : 22);
  shadowText(`Mochila  ${s.inv.length}/${n}`, W / 2, y0 - 14, 14, '#c9c3b5');
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (sz + gap); slotBox(x, y0, sz);
    text(String(i + 1), x + 9, y0 + 10, 12, '#9c9688');
    if (s.inv[i]) icon(s.inv[i], x + sz / 2, y0 + sz / 2 + 2, 42);
  }
  // aim prompt and search progress
  if (s.search) {
    const p = Math.min(1, s.search.p);
    shadowText(`Vasculhando ${s.search.c.name}…`, W / 2, H / 2 + 48, 20, '#fff');
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 90, H / 2 + 66, 180, 8);
    ctx.fillStyle = '#e0d6bd'; ctx.fillRect(W / 2 - 90, H / 2 + 66, 180 * p, 8);
  } else if (s.aim) {
    const c = s.aim;
    const label = !c.searched ? (TOUCH ? `Segure VASCULHAR: ${c.name}` : `Segure E: vasculhar ${c.name}`) : c.items.length ? `E: pegar ${c.items.length} item(ns) da ${c.name}` : `${c.name[0].toUpperCase() + c.name.slice(1)} (vazia)`;
    shadowText(label, W / 2, H / 2 + 48, 20, c.searched && !c.items.length ? '#a8a294' : '#fff');
  }
  // messages
  s.msgs.forEach((m, i) => {
    ctx.globalAlpha = Math.min(1, m.life); shadowText(m.s, W - (TOUCH ? 96 : 28), 34 + i * 26, 17, '#e8e2d4', 'right'); ctx.globalAlpha = 1;
  });
  if (TOUCH) drawTouch();
}

// ---- Loop --------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { if (portrait()) drawPortrait(); else scenes[scene].draw(ALPHA); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  houses, containers,
  get size() { return [W, H]; },
  get buttons() { return BTN; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
