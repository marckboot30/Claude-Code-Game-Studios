  if (s.hold) shadowText(`Segurando: ${PROP[s.hold.kind].name}  ·  ${TOUCH ? 'PEGAR' : 'G'} para jogar`, W / 2, H / 2 + 80, 16, '#e8dcc0');
  // aim prompt and search progress
  if (s.search) {
    const p = Math.min(1, s.search.p);
    shadowText(`Vasculhando ${s.search.c.name}…`, W / 2, H / 2 + 48, 20, '#fff');
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 90, H / 2 + 66, 180, 8);
    ctx.fillStyle = '#e0d6bd'; ctx.fillRect(W / 2 - 90, H / 2 + 66, 180 * p, 8);
  } else if (s.driving) {
    const c = s.driving, kmh = Math.round(Math.abs(carSpeed(c)) * 3.6);
    ctx.fillStyle = 'rgba(10,10,10,0.5)'; ctx.fillRect(W / 2 - 150, H - 190, 300, 64);
    shadowText(`${kmh} km/h`, W / 2 - 130, H - 170, 26, '#f3ead8', 'left', '700');
    text('Combustível', W / 2 + 10, H - 172, 13, '#cfc7b6', 'left');
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 + 10, H - 160, 125, 10);
    ctx.fillStyle = c.fuel < 15 ? '#c0503a' : '#d9a441'; ctx.fillRect(W / 2 + 10, H - 160, 125 * c.fuel / 100, 10);
    text(TOUCH ? 'SAIR: sair do carro' : 'E: sair  ·  Espaço: freio de mão', W / 2, H - 138, 13, '#bfb7a6');
  } else if (s.act) {
    const a = s.act, k = TOUCH ? 'VASCULHAR' : 'E';
    const label = a.kind === 'car' ? `${k}: entrar no carro  ·  combustível ${Math.round(a.car.fuel)}%` : a.kind === 'door' ? `${k}: ${a.door.open ? 'fechar' : 'abrir'} a porta` : `${k}: abastecer o carro (${a.pump.uses} restam)`;
    shadowText(label, W / 2, H / 2 + 48, 20, '#fff');
  } else if (s.skin) {
    shadowText('Esfolando…', W / 2, H / 2 + 48, 20, '#fff');
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 90, H / 2 + 66, 180, 8); ctx.fillStyle = '#b0413a'; ctx.fillRect(W / 2 - 90, H / 2 + 66, 180 * Math.min(1, s.skin.p), 8);
  } else if (s.carcass) {
    shadowText(`${TOUCH ? 'Segure VASCULHAR' : 'Segure E'}: esfolar ${AN[s.carcass.kind].name}`, W / 2, H / 2 + 48, 20, '#fff');
  } else if (s.chop) {
    shadowText(`Cortando a árvore: golpe ${Math.min(tune.tree_hits, s.chop.hits + 1)} de ${tune.tree_hits}`, W / 2, H / 2 + 48, 20, '#fff');
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 90, H / 2 + 66, 180, 8);
    ctx.fillStyle = '#c9a06a'; ctx.fillRect(W / 2 - 90, H / 2 + 66, 180 * Math.min(1, s.chop.p), 8);
  } else if (s.tree && !s.aim) {
    shadowText(TOUCH ? 'Segure VASCULHAR: derrubar a árvore' : 'Segure E: derrubar a árvore com o machado', W / 2, H / 2 + 48, 20, '#fff');
  } else if (!s.aim && !s.craftOpen && nearFire()) {
    shadowText(`Fogueira acesa  ·  ${TOUCH ? 'FABRICAR' : 'C'}: cozinhar`, W / 2, H / 2 + 48, 18, '#ffd9a8');
  } else if (s.aim) {
    const c = s.aim;
    const label = !c.searched ? (TOUCH ? `Segure VASCULHAR: ${c.name}` : `Segure E: vasculhar ${c.name}`) : c.items.length ? `E: pegar ${c.items.length} item(ns) da ${c.name}` : `${c.name[0].toUpperCase() + c.name.slice(1)} (vazia)`;
    shadowText(label, W / 2, H / 2 + 48, 20, c.searched && !c.items.length ? '#a8a294' : '#fff');
  }
  // messages
  s.msgs.forEach((m, i) => {
    ctx.globalAlpha = Math.min(1, m.life); TOUCH ? shadowText(m.s, 28, 200 + i * 22, 15, '#e8e2d4', 'left') : shadowText(m.s, W - 28, 84 + i * 26, 17, '#e8e2d4', 'right'); ctx.globalAlpha = 1;
  });
  if (TOUCH) drawTouch();
}

// ---- Compass: heading letters and the named places, with distance ---------------------------
function drawCompass() {
  const s = state, cw = TOUCH ? 380 : 520, cx = W / 2, y = 30, half = Math.PI / 2;
  const heading = -s.yaw;
  const wrap = a => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
  ctx.save(); ctx.beginPath(); ctx.rect(cx - cw / 2, y - 18, cw, 64); ctx.clip();
  const g = ctx.createLinearGradient(cx - cw / 2, 0, cx + cw / 2, 0);
  g.addColorStop(0, 'rgba(12,12,11,0)'); g.addColorStop(0.15, 'rgba(12,12,11,0.5)'); g.addColorStop(0.85, 'rgba(12,12,11,0.5)'); g.addColorStop(1, 'rgba(12,12,11,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - cw / 2, y - 16, cw, 30);
  const L = ['N', 'NE', 'L', 'SE', 'S', 'SO', 'O', 'NO'];
  for (let i = 0; i < 24; i++) {
    const b = i / 24 * Math.PI * 2, rel = wrap(b - heading); if (Math.abs(rel) > half) continue;
    const x = cx + rel / half * cw / 2;
    if (i % 3 === 0) text(L[i / 3], x, y - 1, i === 0 ? 17 : 14, i === 0 ? '#ffcf8a' : '#e6e0d2', 'center', '700');
    else { ctx.fillStyle = 'rgba(230,224,210,0.5)'; ctx.fillRect(x - 0.75, y - 6, 1.5, 9); }
  }
  const marks = [];
  for (const p of PLACES) {
    const dx = p.x - s.x, dz = p.z - s.z, dist = Math.hypot(dx, dz);
    if (dist < p.r * 0.5 || dist > 900) continue;
    const rel = wrap(Math.atan2(dx, -dz) - heading); if (Math.abs(rel) > half) continue;
    const x = cx + rel / half * cw / 2;
    ctx.fillStyle = '#d9b46a'; ctx.beginPath(); ctx.moveTo(x, y + 9); ctx.lineTo(x + 5, y + 15); ctx.lineTo(x, y + 21); ctx.lineTo(x - 5, y + 15); ctx.fill();
    if (Math.abs(rel) < half * 0.8) marks.push({ x, label: `${p.name} ${Math.round(dist / 10) * 10} m`, dist });
  }
  ctx.restore();
  // labels: nearest first; one that would overlap another goes on the next row
  marks.sort((a, b) => a.dist - b.dist);
  ctx.font = `12px ${FONT}`; const rows = [[], [], []];
  for (const m of marks) {
    const w = ctx.measureText(m.label).width + 10, x0 = m.x - w / 2, x1 = m.x + w / 2;
    const r = rows.findIndex(row => row.every(o => x1 < o[0] || x0 > o[1])); if (r < 0) continue;
    rows[r].push([x0, x1]); shadowText(m.label, m.x, y + 32 + r * 15, 12, r ? '#c8bea6' : '#e8dcc0');
  }
  ctx.fillStyle = '#ffcf8a'; ctx.fillRect(cx - 1, y - 17, 2, 7);
}

// ---- Craft panel ---------------------------------------------------------------------------------
function craftLayout() {
  const pw = Math.min(620, W - 80), rh = TOUCH ? 50 : 54, ph = 64 + RECIPES.length * rh + 40;
  return { pw, rh, ph, px: W / 2 - pw / 2, py: Math.max(12, (H - ph) / 2 - (TOUCH ? 30 : 20)) };
}
function craftRowAt(p) {
  const L = craftLayout();
  if (p.x < L.px || p.x > L.px + L.pw || p.y < L.py || p.y > L.py + L.ph) return -2; // outside: close
  const i = Math.floor((p.y - L.py - 56) / L.rh);
  return i >= 0 && i < RECIPES.length ? i : -1;
}
function drawCraft() {
  const L = craftLayout();
  ctx.fillStyle = 'rgba(14,13,12,0.86)'; ctx.fillRect(L.px, L.py, L.pw, L.ph);
  ctx.strokeStyle = 'rgba(220,210,190,0.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(L.px + 0.5, L.py + 0.5, L.pw - 1, L.ph - 1);
  shadowText('Fabricação', L.px + 22, L.py + 28, 22, '#efe7d6', 'left', '600');
  shadowText(TOUCH ? 'Toque numa receita · toque fora para fechar' : '1 a 5: fabricar  ·  C: fechar', L.px + L.pw - 20, L.py + 28, 14, '#a9a192', 'right');
  RECIPES.forEach((r, i) => {
    const y = L.py + 56 + i * L.rh, m = missing(r), ok = !m.length;
    ctx.fillStyle = ok ? 'rgba(200,170,110,0.16)' : 'rgba(255,255,255,0.03)'; ctx.fillRect(L.px + 10, y + 3, L.pw - 20, L.rh - 6);
    ctx.globalAlpha = ok ? 1 : 0.55;
    text(String(i + 1), L.px + 28, y + L.rh / 2, 14, '#9c9688');
    recipeIcon(r.id, L.px + 62, y + L.rh / 2, 34);
    text(r.name, L.px + 92, y + L.rh / 2 - 9, 17, ok ? '#f3ead8' : '#cfc7b6', 'left', '600');
    const need = Object.keys(r.needs).map(id => `${count(id)}/${r.needs[id]} ${ITEMS[id].name.toLowerCase()}`).join('  ·  ') + (r.fire ? '  ·  fogueira' : '');
    text(need, L.px + 92, y + L.rh / 2 + 11, 13, '#b5ad9c', 'left');
    const what = typeof r.what === 'function' ? r.what() : r.what;
    text(ok ? what : 'falta: ' + m.join(', '), L.px + L.pw - 22, y + L.rh / 2, 13, ok ? '#d8c79e' : '#d79a8a', 'right');
    ctx.globalAlpha = 1;
  });
  text('Pano, fita e fósforos: armários, cômodas e caixas  ·  Lenha: árvores fora da cidade', W / 2, L.py + L.ph - 18, 13, '#8f887b');
}
function recipeIcon(id, x, y, s) {
  if (id === 'fogueira') {
    const u = s / 40; ctx.save(); ctx.translate(x, y); ctx.scale(u, u);
    ctx.fillStyle = '#5a3f2a'; ctx.save(); ctx.rotate(0.35); ctx.fillRect(-16, 8, 32, 6); ctx.restore(); ctx.save(); ctx.rotate(-0.35); ctx.fillRect(-16, 8, 32, 6); ctx.restore();
    ctx.fillStyle = '#e07a2e'; ctx.beginPath(); ctx.moveTo(0, -18); ctx.quadraticCurveTo(14, -2, 8, 10); ctx.lineTo(-8, 10); ctx.quadraticCurveTo(-14, -2, 0, -18); ctx.fill();
    ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.moveTo(0, -6); ctx.quadraticCurveTo(7, 3, 4, 10); ctx.lineTo(-4, 10); ctx.quadraticCurveTo(-7, 3, 0, -6); ctx.fill();
    ctx.restore();
  } else if (id === 'mochila') {
    const u = s / 40; ctx.save(); ctx.translate(x, y); ctx.scale(u, u);
    ctx.fillStyle = '#6b5638'; rr(-13, -14, 26, 30, 6); ctx.fill(); ctx.fillStyle = '#56442c'; ctx.fillRect(-10, 2, 20, 10);
    ctx.strokeStyle = '#3b3023'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -14, 7, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#c9c3b5'; ctx.fillRect(9, -18, 10, 3); ctx.fillRect(12.5, -21.5, 3, 10);
    ctx.restore();
  } else icon(id, x, y, s);
}

// ---- Loop --------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { if (portrait()) drawPortrait(); else scenes[scene].draw(ALPHA); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  houses, containers, trees, fires, RECIPES, cars, props, doors, pumps, playerBody, phys,
  get size() { return [W, H]; },
  logs, lakes,
  animals, GUNS, camera,
  teleport(x, z, yaw) { playerBody.position.set(x, 0.05, z); playerBody.velocity.setZero(); state.x = state.px = x; state.z = state.pz = z; if (yaw !== undefined) state.yaw = yaw; updateChunks(); },
  chunks, updateChunks, get drawCalls() { return renderer.info.render.calls; }, get aimCount() { return aimTargets.length; },
  PLACES, lakes,
  get buttons() { return BTN; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
