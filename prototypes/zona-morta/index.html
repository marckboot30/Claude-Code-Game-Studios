function updateRadio(dt) {

function updatePlay(dt) {

  updatePlayer(dt);
  // inventory toggle
  if (pressed('Tab') || pressed('KeyI')) {
    state.invOpen = !state.invOpen; state.invSel = 0;
    if (state.invOpen) { state.wantUnlock = true; if (document.exitPointerLock) document.exitPointerLock(); }
    else { lockPointer(); }
  }
  if (state.invOpen) updateInventory();
  else {
    if (pressed('Space') || mouseClick) attack();
    if (pressed('Digit1')) { if (p.equip === 'melee') { const owned = MELEE_ORDER.filter(w => w === 'fists' || has(WEAPONS[w].item)); p.melee = owned[(owned.indexOf(p.melee) + 1) % owned.length]; } p.equip = 'melee'; msg(`Em mãos: ${WEAPONS[p.melee].name}`); }
    if (pressed('Digit2')) { if (has('pistola')) { p.equip = 'pistol'; msg(`Pistola: ${state.inv.municao || 0} balas`); } else msg('Você não tem pistola.'); }
    if (pressed('Digit3')) { if (has('curativo')) useItem('curativo'); else if (has('kit')) useItem('kit'); else msg('Sem curativos. Rasgue uma camisa e fabrique (Tab).'); }
    if (pressed('Digit4')) {
      const foods = ['racao', 'feijao', 'batata_assada', 'sardinha', 'batata'], drinks = ['agua', 'refri'];
      const order = p.water < p.food ? drinks.concat(foods) : foods.concat(drinks); const f = order.find(k => has(k));

  mouseClick = false;
  if (pressed('KeyL')) { p.flash = !p.flash; SFX.click(); }
  state.target = findTarget(); state.prompt = promptFor(state.target);
  if (pressed('KeyE') && !state.invOpen) interact(state.target);
  updateNeeds(dt, hour);
  if (scene !== 'play') return;
  updateZombies(dt, hour);
  if (scene !== 'play') return;
  updateRadio(dt);
  // fires and cans

  state.fires = state.fires.filter(f => f.t > 0);

  for (const [tt, s] of tips) if (state.t - dt < tt && state.t >= tt) msg(s, '#d8d0b0');
  if (hour >= 17.6 && hourAt(state.t - dt) < 17.6) msg('O sol está se pondo. A noite traz frio e mais infectados. Lanterna: L. Fogueira: Tab.', '#f0b070');
}

  figWorld.add(new THREE.HemisphereLight(0xc4ccd4, 0x4a4a32, 1.1));
  const s = new THREE.DirectionalLight(0xfff0d8, 1.6); s.position.set(5, 10, 8); figWorld.add(s);
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M('#6a7444')); gr.rotation.x = -Math.PI / 2; figWorld.add(gr);
  const list = [['player', 'Sobrevivente'], ['walker', 'Caminhante'], ['runner', 'Corredor'], ['soldier', 'Soldado infectado']];
  list.forEach(([k, name], i) => {
    const h = k === 'player' ? makePlayer() : makeZombie(k);
    h.g.position.set((i - 1.5) * 2.2, 0, 0); h.g.rotation.y = Math.PI + 0.5; figWorld.add(h.g);
    if (k === 'player') { h.arms[1].hand.add(weaponMesh('crowbar')); h.arms[1].rotation.x = -0.4; }
    else { h.arms[0].rotation.x = k === 'soldier' ? -0.5 : -1.35; h.arms[1].rotation.x = k === 'soldier' ? -1.2 : -1.35; h.torso.rotation.x = -(k === 'runner' ? 0.55 : k === 'walker' ? 0.18 : 0.08); }
    figModels.push({ h, name });
  });
  figCam = new THREE.PerspectiveCamera(40, W / H, 0.1, 100); figCam.position.set(0, 1.6, 9.5); figCam.lookAt(0, 1.0, 0);
}

// ---- Scenes ----------------------------------------------------------------------------------
let titleT = 0;
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      if (!figWorld) buildFigures();
      renderer.render(figWorld, figCam); ctx.clearRect(0, 0, W, H);
      figModels.forEach(({ h, name }) => { vTmp.set(h.g.position.x, -0.15, 0).project(figCam); text(name, (vTmp.x * 0.5 + 0.5) * W, (-vTmp.y * 0.5 + 0.5) * H + 18, 20, '#ffffff', 'center', FONT, 'bold'); });
      text('ZONA MORTA — figuras', W / 2, 40, 24, '#ffffff', 'center', TFONT);
    },
  },
  title: {
    update(dt) { titleT += dt; if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; lockPointer(); } },
    draw() {
      // the world at dawn behind the title, the camera drifting along the beach
      state.t = 0; const a = titleT * 0.05;
      const dl = applyLight(6.6, 0, 20);
      playerModel.g.visible = true; playerModel.g.position.set(0, 0, 31); playerModel.g.rotation.y = 0.4;
      for (const r of rings) r.visible = false;
      cam.position.set(Math.sin(a) * 14 + 6, 3.2, 44); cam.lookAt(0, 2.5, -10);
      renderer.render(world, cam);
      ctx.clearRect(0, 0, W, H);
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(10,10,8,0.65)'); g.addColorStop(0.5, 'rgba(10,10,8,0.2)'); g.addColorStop(1, 'rgba(10,10,8,0.8)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      text(TITLE, W / 2, 150, 104, '#e8dcc0', 'center', TFONT);
      ctx.fillStyle = '#a83a2a'; ctx.fillRect(W / 2 - 230, 212, 460, 4);
      text('Uma vida. Um rádio ao norte. Tudo o que faz barulho atrai os infectados.', W / 2, 244, 20, '#d8ccb0');
      panel(W / 2 - 330, 300, 660, 210, 0.55);
      CONTROLS.forEach((c, i) => text(c, W / 2, 330 + i * 38, 18, '#e8e0c8'));
      text('Enter para começar', W / 2, H - 120, 28, '#ffd870', 'center', FONT, 'bold');
      text('Se você morrer, perde tudo e recomeça na praia com outro saque.', W / 2, H - 80, 16, '#c8c0a8');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || (pressed('Escape') && !state.invOpen)) { scene = 'pause'; state.wantUnlock = true; if (document.exitPointerLock) document.exitPointerLock(); return; }
      if (pressed('Escape') && state.invOpen) { state.invOpen = false; }
      updatePlay(dt);
    },
    draw() { const dl = renderWorld(ALPHA); drawHUD(dl); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Enter')) { scene = 'play'; lockPointer(); } },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      text('PAUSADO', W / 2, 160, 60, '#e8dcc0', 'center', TFONT);
      CONTROLS.forEach((c, i) => text(c, W / 2, 260 + i * 36, 18, '#e8e0c8'));
      text('P ou Enter para voltar', W / 2, H - 120, 24, '#ffd870', 'center', FONT, 'bold');
    },
  },
  over: {
    update() { if (pressed('KeyR') || pressed('Enter')) { runs++; reset(); scene = 'play'; lockPointer(); } },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(40,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      text('VOCÊ MORREU', W / 2, H / 2 - 110, 80, '#e8c8b0', 'center', TFONT);
      text(state.cause, W / 2, H / 2 - 40, 24, '#ffb0a0');
      statsLines(H / 2 + 10);
      text('Uma vida só: tudo se perdeu. R para recomeçar na praia, com outro saque', W / 2, H / 2 + 150, 20, '#ffd870', 'center', FONT, 'bold');
    },
  },
  results: {
    update() { if (pressed('Enter') || pressed('KeyR')) { runs++; reset(); scene = 'play'; lockPointer(); } },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(0,20,10,0.6)'; ctx.fillRect(0, 0, W, H);
      text('RESGATADO', W / 2, H / 2 - 110, 80, '#d8f0c8', 'center', TFONT);
      text('Você saiu vivo da Zona Morta.', W / 2, H / 2 - 40, 24, '#c8e8b8');
      statsLines(H / 2 + 10);
      text('Enter para jogar de novo (outro saque, outros perigos)', W / 2, H / 2 + 150, 20, '#ffd870', 'center', FONT, 'bold');
    },
  },
};
function statsLines(y) {
  const m = Math.floor(state.t / 60), s = Math.floor(state.t % 60);
  text(`Tempo vivo: ${m} min ${String(s).padStart(2, '0')} s   ·   Infectados abatidos: ${state.kills}   ·   Andou: ${Math.round(state.walked)} m   ·   Itens saqueados: ${state.looted}`, W / 2, y + 30, 18, '#e8e0c8');
  const hh = hourAt(state.t); text(`Chegou às ${String(Math.floor(hh)).padStart(2, '0')}:${String(Math.floor((hh % 1) * 60)).padStart(2, '0')} do primeiro dia`, W / 2, y + 64, 16, '#c8c0a8');
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
