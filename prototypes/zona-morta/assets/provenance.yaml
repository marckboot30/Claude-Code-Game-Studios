  tool: "a PIL script packing 13 Poly Haven textures (1k diffuse, resized to 512) into a 4x4 atlas: sparse_grass, asphalt_02, concrete_tiles, dry_ground_01, farm_soil, wood_floor_worn, floor_tiles_06, floor_tiles_02, large_floor_tiles_02, concrete_floor_02, dirty_carpet, coast_sand_01, stony_dirt_path"
